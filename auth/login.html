<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 赛析足球</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Oswald:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #d4af37;
    --gold-bright: #f0d57a;
    --gold-line: rgba(212, 175, 55, 0.25);
    --txt: #e9e7de;
    --muted: #8fa39b;
    --panel: rgba(15, 32, 27, 0.85);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--txt);
    background:
      radial-gradient(1100px 550px at 50% -8%, rgba(212, 175, 55, 0.08), transparent 62%),
      radial-gradient(900px 520px at 88% 8%, rgba(42, 157, 143, 0.09), transparent 60%),
      radial-gradient(1000px 700px at 8% 92%, rgba(24, 68, 110, 0.22), transparent 60%),
      linear-gradient(180deg, #0b211a 0%, #071510 46%, #050d0a 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: var(--panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--gold-line);
    border-radius: 18px;
    padding: 40px 32px 32px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  }
  .logo {
    font-family: Oswald, "Noto Sans SC", sans-serif;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 3px;
    color: var(--gold);
    text-align: center;
  }
  .slogan {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin: 10px 0 30px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .field { margin-bottom: 18px; }
  .row { display: flex; gap: 10px; }
  input {
    width: 100%;
    background: rgba(5, 13, 10, 0.7);
    border: 1px solid rgba(212, 175, 55, 0.2);
    border-radius: 10px;
    color: var(--txt);
    font-size: 16px;
    padding: 13px 14px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
    font-family: inherit;
  }
  input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
  }
  input::placeholder { color: #54665f; }
  #code {
    font-size: 28px;
    letter-spacing: 10px;
    text-align: center;
    font-weight: 700;
    color: var(--gold-bright);
  }
  .btn {
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    transition: opacity .2s, transform .1s;
  }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-send {
    flex-shrink: 0;
    padding: 0 16px;
    background: rgba(212, 175, 55, 0.12);
    border: 1px solid var(--gold-line);
    color: var(--gold);
    font-size: 14px;
    white-space: nowrap;
    min-width: 112px;
  }
  .btn-send:not(:disabled):hover { background: rgba(212, 175, 55, 0.22); }
  .btn-login {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    background: linear-gradient(135deg, var(--gold), #b8952e);
    color: #071510;
    letter-spacing: 4px;
    margin-top: 6px;
  }
  .btn-login:not(:disabled):hover { filter: brightness(1.08); }
  .msg {
    min-height: 20px;
    font-size: 13px;
    text-align: center;
    margin-top: 14px;
    line-height: 1.6;
  }
  .msg.err { color: #ff8585; }
  .msg.ok  { color: #3fd3b6; }
  .footer {
    margin-top: 26px;
    color: #5c6f68;
    font-size: 11px;
    text-align: center;
    line-height: 1.7;
  }
  .hidden { display: none; }
  @media (max-width: 420px) {
    .card { padding: 32px 22px 26px; }
    #code { font-size: 24px; letter-spacing: 8px; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">赛析足球</div>
    <div class="slogan">登录后查看全球 27 国联赛路图</div>

    <div class="field">
      <label for="email">邮箱</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="email" autofocus>
    </div>

    <div class="field">
      <label for="code">验证码</label>
      <div class="row">
        <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="——————" autocomplete="one-time-code">
        <button id="btnSend" class="btn btn-send">发送验证码</button>
      </div>
    </div>

    <button id="btnLogin" class="btn btn-login">登 录</button>
    <div id="msg" class="msg"></div>
  </div>

  <div class="footer">
    登录即表示同意本站使用条款 · 一次登录 30 天有效<br>
    数据仅供参考，不构成投资建议
  </div>

<script>
(function () {
  var emailEl = document.getElementById('email');
  var codeEl = document.getElementById('code');
  var btnSend = document.getElementById('btnSend');
  var btnLogin = document.getElementById('btnLogin');
  var msg = document.getElementById('msg');
  var countdown = 0, timer = null;

  function say(text, ok) {
    msg.textContent = text || '';
    msg.className = 'msg ' + (ok ? 'ok' : 'err');
  }
  function validEmail(v) { return /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(v); }

  function startCountdown() {
    countdown = 60;
    btnSend.disabled = true;
    btnSend.textContent = countdown + ' 秒后重发';
    timer = setInterval(function () {
      countdown--;
      if (countdown <= 0) {
        clearInterval(timer);
        btnSend.disabled = false;
        btnSend.textContent = '重新发送';
      } else {
        btnSend.textContent = countdown + ' 秒后重发';
      }
    }, 1000);
  }

  btnSend.addEventListener('click', function () {
    var email = emailEl.value.trim();
    if (!validEmail(email)) { say('请输入正确的邮箱地址'); emailEl.focus(); return; }
    btnSend.disabled = true;
    say('');
    fetch('/api/auth/send-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email })
    }).then(function (r) { return r.json().then(function (d) { return { st: r.status, d: d }; }); })
      .then(function (res) {
        if (res.d && res.d.ok) {
          say('验证码已发送，请查收邮箱（10 分钟内有效）', true);
          startCountdown();
          codeEl.focus();
        } else {
          say((res.d && res.d.error) || '发送失败，请稍后重试');
          btnSend.disabled = false;
        }
      }).catch(function () { say('网络异常，请稍后重试'); btnSend.disabled = false; });
  });

  function doLogin() {
    var email = emailEl.value.trim();
    var code = codeEl.value.trim();
    if (!validEmail(email)) { say('请输入正确的邮箱地址'); emailEl.focus(); return; }
    if (!/^\d{6}$/.test(code)) { say('请输入 6 位数字验证码'); codeEl.focus(); return; }
    btnLogin.disabled = true;
    say('正在验证…', true);
    fetch('/api/auth/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, code: code })
    }).then(function (r) { return r.json().then(function (d) { return { st: r.status, d: d }; }); })
      .then(function (res) {
        if (res.d && res.d.ok) {
          say('登录成功，正在进入…', true);
          window.location.href = '/';
        } else {
          say((res.d && res.d.error) || '验证失败');
          btnLogin.disabled = false;
        }
      }).catch(function () { say('网络异常，请稍后重试'); btnLogin.disabled = false; });
  }

  btnLogin.addEventListener('click', doLogin);
  codeEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  emailEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') codeEl.focus(); });
})();
</script>
</body>
</html>
