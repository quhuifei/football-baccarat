# ============================================================
# 赛析足球 · 登录墙配置片段
# 用法：把以下内容合并进 saixz.com 的 server 块（football.conf），
#       上架时 root 切回 /var/www/football 后启用本配置。
# 前提：football-auth.service 已在 127.0.0.1:8400 运行。
# ============================================================

# ---- 1) 认证 API 反代（不做 auth_request，否则死循环）----
location /api/auth/ {
    proxy_pass http://127.0.0.1:8400;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# ---- 2) 登录页本身不需要登录（不做 auth_request，否则死循环）----
# login.html 放在 /var/www/football/login.html
location = /login.html {
    # 登录页每次都要最新版本，不缓存
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
}

# ---- 3) 主 location：登录墙 ----
location / {
    # auth_request 命中上面 location /api/auth/ 块中的 /api/auth/check：
    # 子请求带 Cookie 去后端验证，200 放行 / 401 拒绝
    auth_request /api/auth/check;
    error_page 401 =302 https://$host/login.html;

    # 静态文件缓存思路沿用现有配置：
    # 图片/字体/媒体长缓存；html/js/css 短缓存不重复声明（在 football.conf 已有的话不必重复）
    try_files $uri $uri/ =404;
}

# 可选：静态资源长缓存（若 football.conf 已有类似规则，可略过本段）
location ~* \.(?:png|jpe?g|gif|webp|svg|ico|woff2?)$ {
    auth_request /api/auth/check;
    error_page 401 =302 https://$host/login.html;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
}
