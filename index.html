<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>全球27国联赛 · 赛果路图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #d4af37;
    --gold-bright: #f0d57a;
    --gold-line: rgba(212, 175, 55, 0.18);
    --txt: #e9e7de;
    --muted: #8fa39b;
    --panel: rgba(15, 32, 27, 0.72);
    --panel-solid: #0e1f1a;
    --banker: #ff6b6b;
    --player: #5eb0f8;
    --tie: #3fd3b6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  ::selection { background: rgba(212, 175, 55, 0.35); color: #fff; }
  html { scrollbar-color: rgba(212, 175, 55, 0.3) transparent; }
  *::-webkit-scrollbar { width: 9px; height: 9px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb {
    background: rgba(212, 175, 55, 0.25);
    border-radius: 99px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }
  *::-webkit-scrollbar-thumb:hover { background: rgba(212, 175, 55, 0.45); background-clip: padding-box; }
  body {
    font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(1100px 550px at 50% -8%, rgba(212, 175, 55, 0.08), transparent 62%),
      radial-gradient(900px 520px at 88% 8%, rgba(42, 157, 143, 0.09), transparent 60%),
      radial-gradient(1000px 700px at 8% 92%, rgba(24, 68, 110, 0.22), transparent 60%),
      linear-gradient(180deg, #0b211a 0%, #071510 46%, #050d0a 100%);
    background-attachment: fixed;
    color: var(--txt);
    padding: 66px 12px 10px;
    min-height: 100vh;
  }
  :focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
    border-radius: 6px;
  }
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: none; }
  }
  .container {
    max-width: none;
    margin: 0 auto;
    position: relative;
  }
  h1 {
    text-align: center;
    margin-bottom: 4px;
    font-family: "Oswald", "Noto Sans SC", sans-serif;
    font-size: 32px;
    font-weight: 600;
    letter-spacing: 5px;
    background: linear-gradient(180deg, #f7e9b8 0%, var(--gold) 58%, #96781d 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 2px 10px rgba(212, 175, 55, 0.22));
  }
  h1::after {
    content: '';
    display: block;
    width: 150px;
    height: 1px;
    margin: 10px auto 0;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    box-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    margin-bottom: 14px;
    font-size: 13px;
    letter-spacing: 1px;
  }
  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin: 0 auto 14px;
    padding: 12px 20px;
    width: fit-content;
    max-width: 100%;
    flex-wrap: wrap;
    background: var(--panel);
    border: 1px solid var(--gold-line);
    border-radius: 14px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    animation: riseIn 0.45s ease both;
  }
  .year-select {
    appearance: none;
    -webkit-appearance: none;
    padding: 9px 36px 9px 14px;
    border: 1px solid rgba(212, 175, 55, 0.28);
    background: rgba(8, 20, 16, 0.85) url('data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2212%22%20height%3D%2212%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23d4af37%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M6%209l6%206%206-6%22%2F%3E%3C%2Fsvg%3E') no-repeat right 13px center;
    color: var(--txt);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    min-width: 140px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .year-select:hover { border-color: rgba(212, 175, 55, 0.55); }
  .year-select:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.16);
  }
  .year-select option {
    background: #0c1a15;
    color: var(--txt);
  }
  /* ===== 联赛选择器 ===== */
  .league-btn {
    text-align: left;
    min-width: 190px;
    cursor: pointer;
    font-family: inherit;
  }
  .league-btn .lb-en { color: var(--muted); font-size: 12px; margin-left: 4px; }
  .league-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(4, 10, 8, 0.72);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 2000;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .league-overlay.open { display: flex; }
  .league-panel {
    width: min(780px, 100%);
    max-height: min(84vh, 720px);
    background: linear-gradient(180deg, #10231c, #0a1712);
    border: 1px solid rgba(212, 175, 55, 0.35);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    animation: riseIn 0.3s ease both;
  }
  .league-panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px;
    border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    color: var(--gold);
    font-weight: 600;
    letter-spacing: 1px;
    font-size: 15px;
  }
  .league-panel-close {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid rgba(212, 175, 55, 0.4);
    background: rgba(212, 175, 55, 0.12);
    color: var(--gold-bright);
    font-size: 13px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .league-panel-body {
    overflow-y: auto;
    padding: 8px 16px 18px;
    -webkit-overflow-scrolling: touch;
  }
  .league-group-title {
    color: var(--gold);
    font-size: 13px;
    letter-spacing: 2px;
    margin: 14px 4px 8px;
  }
  .league-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 8px;
  }
  .league-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border: 1px solid rgba(212, 175, 55, 0.16);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.03);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .league-item:hover { border-color: var(--gold); background: rgba(212, 175, 55, 0.08); }
  .league-item.active {
    border-color: var(--gold);
    background: rgba(212, 175, 55, 0.14);
    box-shadow: 0 0 12px rgba(212, 175, 55, 0.22);
  }
  /* 有更新红点 */
  .league-item { position: relative; }
  .league-item.has-update::after {
    content: ''; position: absolute; top: 7px; right: 7px;
    width: 9px; height: 9px; border-radius: 50%;
    background: #ff3b30; box-shadow: 0 0 6px rgba(255, 59, 48, 0.8);
  }
  .league-btn { position: relative; }
  #league-btn-dot {
    position: absolute; top: -4px; right: -4px; width: 10px; height: 10px;
    border-radius: 50%; background: #ff3b30;
    box-shadow: 0 0 6px rgba(255, 59, 48, 0.8); z-index: 2;
  }
  #league-btn-dot.hidden { display: none; }
  .league-item .lflag { font-size: 20px; line-height: 1; }
  .league-item .ltext { display: flex; flex-direction: column; min-width: 0; }
  .league-item .lcn { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .league-item .len {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .league-item .lcount { margin-left: auto; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .export-btn {
    padding: 9px 16px;
    border: 1px solid rgba(212, 175, 55, 0.35);
    background: rgba(8, 20, 16, 0.7);
    color: var(--txt);
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .export-btn:hover {
    border-color: var(--gold);
    box-shadow: 0 0 14px rgba(212, 175, 55, 0.22);
    transform: translateY(-1px);
  }
  .legend {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 26px;
    margin: 0 auto 14px;
    padding: 8px 24px;
    width: fit-content;
    max-width: 100%;
    flex-wrap: wrap;
    background: var(--panel);
    border: 1px solid var(--gold-line);
    border-radius: 999px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    animation: riseIn 0.45s ease 0.04s both;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
  }
  .legend-circle {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.35);
  }
  .banker { background: radial-gradient(circle at 32% 28%, #ff8585, #d62f3a 60%, #a11d25); }
  .player { background: radial-gradient(circle at 32% 28%, #74c0fc, #1971c2 60%, #125094); border-color: rgba(255, 255, 255, 0.3); }
  .tie { background: radial-gradient(circle at 32% 28%, #63e6be, #2a9d8f 60%, #1d6f64); }
  .tie-slash {
    width: 22px;
    height: 22px;
    position: relative;
  }
  .tie-slash::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 10%;
    width: 80%;
    height: 3px;
    background: var(--tie);
    transform: rotate(-45deg);
    transform-origin: center;
    box-shadow: 0 0 6px rgba(63, 211, 182, 0.8);
    border-radius: 2px;
  }
  .road-wrapper {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    background: linear-gradient(180deg, rgba(13, 30, 24, 0.92), rgba(7, 16, 13, 0.95));
    border: 1px solid rgba(212, 175, 55, 0.22);
    border-radius: 14px;
    padding: 12px;
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.45), inset 0 2px 22px rgba(0, 0, 0, 0.55);
    margin-bottom: 14px;
    animation: riseIn 0.5s ease 0.08s both;
  }
  .road {
    display: grid;
    gap: 2px;
    min-width: fit-content;
  }
  .cell {
    width: 40px;
    height: 40px;
    background: rgba(255, 255, 255, 0.028);
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
    transition: background 0.15s;
  }
  .cell:hover {
    background: rgba(212, 175, 55, 0.09);
  }
  .cell-circle {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Oswald", "Noto Sans SC", sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.65);
    border: 2px solid rgba(255, 255, 255, 0.32);
    box-shadow: 0 3px 9px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.4);
    transition: transform 0.16s ease, box-shadow 0.16s ease;
  }
  .cell-circle:hover {
    transform: scale(1.14);
    box-shadow: 0 5px 16px rgba(0, 0, 0, 0.55), 0 0 14px rgba(212, 175, 55, 0.35), inset 0 1px 2px rgba(255, 255, 255, 0.45);
    z-index: 5;
    position: relative;
  }
  .cell-B { background: radial-gradient(circle at 32% 28%, #ff8585, #d62f3a 58%, #a11d25); }
  .cell-P { background: radial-gradient(circle at 32% 28%, #74c0fc, #1971c2 58%, #125094); }
  .cell-T { background: radial-gradient(circle at 32% 28%, #63e6be, #2a9d8f 58%, #1d6f64); }
  .cell-tie {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
  }
  .cell-tie-line {
    position: absolute;
    top: 50%;
    left: 12%;
    width: 76%;
    height: 3px;
    background: #2a9d8f;
    transform-origin: center;
    box-shadow: 0 0 5px #2a9d8f, 0 0 9px rgba(42, 157, 143, 0.7);
    border-radius: 2px;
    pointer-events: auto;
    cursor: pointer;
    transition: background 0.15s, box-shadow 0.15s;
  }
  .cell-tie-line:hover {
    background: #63e6be;
    box-shadow: 0 0 8px #2a9d8f, 0 0 14px rgba(42, 157, 143, 0.9);
  }
  .cell-tie-badge {
    position: absolute;
    bottom: 2px;
    right: 2px;
    background: #2a9d8f;
    color: #fff;
    font-size: 9px;
    font-weight: bold;
    padding: 1px 4px;
    border-radius: 3px;
    z-index: 20;
    box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
    pointer-events: none;
  }
  .tooltip {
    position: fixed;
    background: rgba(8, 19, 15, 0.94);
    border: 1px solid rgba(212, 175, 55, 0.32);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--txt);
    font-size: 12px;
    line-height: 1.6;
    pointer-events: none;
    z-index: 1000;
    max-width: min(320px, calc(100vw - 24px));
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
  }
  /* 点击固定（手机端）时可交互，供 ✕ 按钮接收点击 */
  .tooltip.sticky { pointer-events: auto; }
  .tooltip-close {
    display: none;
    position: absolute;
    top: 5px;
    right: 5px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1px solid rgba(212, 175, 55, 0.4);
    background: rgba(212, 175, 55, 0.14);
    color: var(--gold-bright);
    font-size: 12px;
    line-height: 1;
    padding: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .tooltip .match-row {
    margin-bottom: 4px;
    padding-bottom: 4px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  }
  .tooltip .match-row:last-child {
    margin-bottom: 0;
    padding-bottom: 0;
    border-bottom: none;
  }
  .tooltip .match-date {
    color: var(--gold);
    font-weight: bold;
  }
  .tooltip .result-B { color: var(--banker); }
  .tooltip .result-P { color: var(--player); }
  .tooltip .result-T { color: var(--tie); }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 12px;
    animation: riseIn 0.5s ease 0.05s both;
  }
  .stat-card {
    position: relative;
    background: linear-gradient(160deg, rgba(21, 42, 35, 0.9), rgba(9, 20, 16, 0.92));
    padding: 9px 10px 8px;
    border-radius: 10px;
    text-align: center;
    border: 1px solid rgba(212, 175, 55, 0.15);
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
  }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 18%;
    right: 18%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.65), transparent);
  }
  .stat-card:hover {
    transform: translateY(-3px);
    border-color: rgba(212, 175, 55, 0.4);
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5), 0 0 18px rgba(212, 175, 55, 0.12);
  }
  .stat-number {
    font-family: "Oswald", "Noto Sans SC", sans-serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 1px;
    margin-bottom: 2px;
  }
  .stat-label {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 1px;
  }
  .match-list {
    background: linear-gradient(180deg, rgba(15, 32, 27, 0.85), rgba(8, 18, 14, 0.9));
    border: 1px solid var(--gold-line);
    border-radius: 14px;
    padding: 14px;
    max-height: 600px;
    overflow-y: auto;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    animation: riseIn 0.5s ease 0.12s both;
  }
  .match-list h2 {
    font-size: 17px;
    margin-bottom: 10px;
    color: var(--gold);
    font-family: "Oswald", "Noto Sans SC", sans-serif;
    letter-spacing: 2px;
  }
  /* ===== 赛果列表 + 聊天室 双栏布局 ===== */
  .match-chat-row { display: flex; flex-direction: column; gap: 16px; }
  @media (min-width: 900px) {
    .match-chat-row { flex-direction: row; align-items: stretch; }
    .match-chat-row .match-list { flex: 1 1 0; min-width: 0; }
    .match-chat-row .chat-panel { flex: 1 1 0; min-width: 0; height: 600px; }
  }
  /* ===== 聊天室 ===== */
  .chat-panel {
    background: linear-gradient(180deg, rgba(15, 32, 27, 0.85), rgba(8, 18, 14, 0.9));
    border: 1px solid var(--gold-line);
    border-radius: 14px;
    padding: 14px;
    display: flex; flex-direction: column;
    height: 480px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    animation: riseIn 0.5s ease 0.12s both;
  }
  .chat-panel h2 {
    font-size: 17px;
    margin-bottom: 10px;
    color: var(--gold);
    font-family: "Oswald", "Noto Sans SC", sans-serif;
    letter-spacing: 2px;
    flex-shrink: 0;
  }
  .chat-msgs {
    flex: 1; overflow-y: auto; min-height: 0;
    display: flex; flex-direction: column; gap: 10px;
    padding: 4px 2px;
  }
  .chat-empty { color: var(--muted); font-size: 13px; text-align: center; margin: auto; }
  /* 抖音评论区风格：全部靠左、无头像、名字内容同一行 */
  .chat-item { display: block; }
  .chat-line {
    font-size: 13px; line-height: 1.7; color: var(--txt);
    word-break: break-word; white-space: pre-wrap;
  }
  .chat-line .nick { color: var(--gold); font-weight: 700; margin-right: 2px; }
  .chat-line .ctime { color: #5c6f68; font-size: 11px; margin-left: 6px; }
  .chat-thumb {
    display: block; margin-top: 4px; max-width: 180px; max-height: 180px;
    border-radius: 10px; border: 1px solid rgba(212, 175, 55, 0.2);
    cursor: zoom-in;
  }
  .chat-lightbox {
    position: fixed; inset: 0; z-index: 4500;
    background: rgba(4, 10, 8, 0.92);
    display: flex; align-items: center; justify-content: center;
    cursor: zoom-out; padding: 20px;
  }
  .chat-lightbox.hidden { display: none; }
  .chat-lightbox img {
    max-width: 100%; max-height: 100%; border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7); cursor: default;
  }
  .chat-input-row { display: flex; gap: 8px; margin-top: 10px; flex-shrink: 0; }
  .chat-input-row input {
    flex: 1; min-width: 0;
    background: rgba(5, 13, 10, 0.7);
    border: 1px solid rgba(212, 175, 55, 0.2);
    border-radius: 10px; color: var(--txt); font-size: 14px;
    padding: 10px 12px; outline: none; font-family: inherit;
  }
  .chat-input-row input:focus { border-color: var(--gold); }
  .chat-input-row input:disabled, .chat-input-row input[readonly] { opacity: 0.55; cursor: pointer; }
  .chat-input-row button {
    flex-shrink: 0; border: none; border-radius: 10px; cursor: pointer;
    background: linear-gradient(135deg, var(--gold), #b8952e);
    color: #071510; font-weight: 700; font-size: 14px; padding: 0 18px;
    font-family: inherit;
  }
  .chat-input-row button:disabled { opacity: 0.45; cursor: not-allowed; }
  .chat-img-btn {
    flex-shrink: 0; border-radius: 10px; cursor: pointer;
    background: rgba(212, 175, 55, 0.12); border: 1px solid var(--gold-line);
    color: var(--gold); font-size: 16px; padding: 0 12px;
    display: flex; align-items: center; font-family: inherit;
  }

<script>
// 联赛数据按需懒加载：leagues.js（目录）启动加载，data/{code}.js 选中时加载，
// football_latest.js（全部联赛当前赛季增量）按联赛码暂存，联赛数据加载后合并。
const allData = {};              // 已加载联赛缓存 {code: {code,name,cn,season_type,matches}}
const latestByLeague = {};       // 增量数据按联赛码分组暂存
let latestMeta = null;           // {count, updated_at}
const leagueMetaMap = {};        // code -> manifest 条目

let currentLeague = 'E0';
let currentSeason = 'all';
let leagueLoadToken = 0;         // 防止快速切换联赛时的异步竞态
const resultLabels = {'B': '庄', 'P': '闲', 'T': '和'};

// 赛季显示：跨年联赛 "2014" -> "2014-15"；自然年联赛 "2026" -> "2026"
function fmtSeason(y) {
  const n = parseInt(y, 10);
  if (isNaN(n)) return y;
  const meta = leagueMetaMap[currentLeague];
  if (meta && meta.season_type === 'calendar') return String(n);
  return n + '-' + String((n + 1) % 100).padStart(2, '0');
}

function getCurrentMatches() {
  if (!allData[currentLeague]) return [];
  return allData[currentLeague].matches.map((m, i) => ({...m, _idx: i, _league: currentLeague}));
}

function getFilteredMatches() {
  let seq = 0;
  const base = getCurrentMatches();
  return base.filter(m => {
    if (currentSeason === 'all') return true;
    return m.season === currentSeason;
  }).map(m => ({...m, _seq: seq++}));
}

function generateStandardRoad(results, maxRows = 6) {
  const grid = {};
  const cellMatches = {};
  let lastPos = null;
  let currentCol = -1;
  let pendingTies = [];

  results.forEach((r) => {
    const res = r.result;
    const ref = { idx: r._idx, seq: r._seq };
    if (res === 'T') {
      if (lastPos) {
        const key = lastPos.join(',');
        cellMatches[key] = cellMatches[key] || [];
        cellMatches[key].push(ref);
      } else {
        pendingTies.push(ref);
      }
      return;
    }

    if (Object.keys(grid).length === 0) {
      currentCol = 0;
      grid['0,0'] = res;
      lastPos = [0, 0];
      cellMatches['0,0'] = [ref, ...pendingTies];
      pendingTies = [];
      return;
    }

    const lastRes = grid[lastPos.join(',')];
    if (res === lastRes) {
      const [col, row] = lastPos;
      let newRow = row + 1;
      while (newRow < maxRows && grid[col + ',' + newRow]) newRow++;
      if (newRow < maxRows && !grid[col + ',' + newRow]) {
        grid[col + ',' + newRow] = res;
        lastPos = [col, newRow];
        cellMatches[col + ',' + newRow] = [ref];
      } else {
        let newCol = col + 1;
        while (grid[newCol + ',' + row]) newCol++;
        grid[newCol + ',' + row] = res;
        lastPos = [newCol, row];
        cellMatches[newCol + ',' + row] = [ref];
      }
    } else {
      const newCol = currentCol + 1;
      grid[newCol + ',0'] = res;
      lastPos = [newCol, 0];
      currentCol = newCol;
      cellMatches[newCol + ',0'] = [ref];
    }
  });

  if (pendingTies.length > 0 && Object.keys(grid).length === 0) {
    grid['0,0'] = 'T';
    lastPos = [0, 0];
    cellMatches['0,0'] = pendingTies;
  }

  return { grid, cellMatches };
}

function getTooltipContent(refs) {
  return refs.map(ref => {
    const league = ref._league || currentLeague;
    const m = allData[league].matches[ref.idx];
    const label = resultLabels[m.result];
    const cls = 'result-' + m.result;
    return `<div class="match-row">
      <div class="match-date">#${ref.seq + 1} · ${m.date}</div>
      <div>${m.team1_cn} ${m.s1}–${m.s2} ${m.team2_cn} <span class="${cls}">[${label}]</span></div>
    </div>`;
  }).join('');
}

function renderRoadInto(roadEl, matches, league) {
  const roadData = generateStandardRoad(matches);

  const grid = roadData.grid;
  const cellMatches = roadData.cellMatches;

  let maxCol = 0, maxRow = 0;
  for (const key in grid) {
    const [c, r] = key.split(',').map(Number);
    maxCol = Math.max(maxCol, c);
    maxRow = Math.max(maxRow, r);
  }

  roadEl.style.gridTemplateColumns = `repeat(${maxCol + 1}, 40px)`;
  roadEl.style.gridTemplateRows = `repeat(${maxRow + 1}, 40px)`;
  roadEl.innerHTML = '';

  for (let r = 0; r <= maxRow; r++) {
    for (let c = 0; c <= maxCol; c++) {
      const key = c + ',' + r;
      const cell = document.createElement('div');
      cell.className = 'cell';

      if (grid[key]) {
        const circle = document.createElement('div');
        circle.className = 'cell-circle cell-' + grid[key];
        circle.textContent = grid[key];
        cell.appendChild(circle);

        const refs = cellMatches[key] || [];
        const mainRef = refs[0];
        const tieRefs = refs.slice(1).filter(ref => allData[league].matches[ref.idx].result === 'T');

        // tooltip 显示该单元格所有相关比赛（包括和局）
        const tooltipRefs = refs;
        if (mainRef !== undefined) {
          circle.addEventListener('mouseenter', (e) => {
            if (isRecentTouch()) return;
            tooltipPinned = false;
            showTooltip(e, tooltipRefs);
          });
          circle.addEventListener('mousemove', (e) => {
            if (isRecentTouch() || tooltipPinned) return;
            moveTooltip(e);
          });
          circle.addEventListener('mouseleave', () => {
            if (isRecentTouch() || tooltipPinned) return;
            hideTooltip();
          });
          // 点击（手机触摸）切换显示/隐藏
          circle.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleTooltipAt(e, tooltipRefs);
          });
        }

        // 显示和局斜杠（叠加在庄/闲格上）
        const tieCount = tieRefs.length;
        const maxVisible = 4;
        const visibleCount = Math.min(tieCount, maxVisible);

        // 根据和局数量动态调整斜杠长度/角度，防止过多时溢出或重叠
        const lineWidth = tieCount >= 4 ? '64%' : '76%';
        const lineLeft = tieCount >= 4 ? '18%' : '12%';
        const angleStep = tieCount <= 2 ? 35 : (tieCount <= 3 ? 23 : 20);
        const startAngle = tieCount <= 2 ? -27 : (tieCount <= 3 ? -22 : -18);
        const offsetStep = tieCount >= 4 ? 2.5 : 3.5;

        tieRefs.forEach((ref, i) => {
          if (i >= maxVisible) return;
          const slash = document.createElement('div');
          slash.className = 'cell-tie';
          const line = document.createElement('div');
          line.className = 'cell-tie-line';
          const angle = startAngle - (i * angleStep);
          const offset = (i - (visibleCount - 1) / 2) * offsetStep;
          line.style.width = lineWidth;
          line.style.left = lineLeft;
          line.style.transform = `rotate(${angle}deg) translateY(${offset}px)`;
          line.addEventListener('mouseenter', (e) => {
            if (isRecentTouch()) return;
            tooltipPinned = false;
            showTooltip(e, [ref]);
          });
          line.addEventListener('mousemove', (e) => {
            if (isRecentTouch() || tooltipPinned) return;
            moveTooltip(e);
          });
          line.addEventListener('mouseleave', () => {
            if (isRecentTouch() || tooltipPinned) return;
            hideTooltip();
          });
          line.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleTooltipAt(e, [ref]);
          });
          slash.appendChild(line);
          cell.appendChild(slash);
        });

        // 超过显示上限时添加 +N 角标
        if (tieCount > maxVisible) {
          const badge = document.createElement('div');
          badge.className = 'cell-tie-badge';
          badge.textContent = '+' + (tieCount - maxVisible);
          cell.appendChild(badge);
        }
      }

      roadEl.appendChild(cell);
    }
  }
}

const tooltip = document.getElementById('tooltip');

let tooltipPinned = false;   // 点击固定状态（手机端）
let tooltipKey = null;       // 当前固定 tooltip 对应的格子标识
let lastTouchTs = 0;         // 最近一次触摸时间，用于在触屏上抑制 hover

document.addEventListener('touchstart', () => { lastTouchTs = Date.now(); }, { passive: true, capture: true });
function isRecentTouch() {
  return Date.now() - lastTouchTs < 700;
}

// 触摸滚动页面/路图时关闭 tooltip
document.addEventListener('touchmove', () => {
  if (tooltip.style.display === 'block') hideTooltip();
}, { passive: true });

// 点击页面其他任何地方关闭 tooltip（格子上的 click 已 stopPropagation）
document.addEventListener('click', (e) => {
  if (tooltip.style.display !== 'block') return;
  if (tooltip.contains(e.target)) return;
  hideTooltip();
});

function refsKey(refs) {
  return refs.map(r => r.idx + ':' + r.seq).join('|');
}

function toggleTooltipAt(e, refs) {
  const key = refsKey(refs);
  if (tooltipPinned && tooltipKey === key && tooltip.style.display === 'block') {
    hideTooltip();
    return;
  }
  tooltipPinned = true;
  tooltipKey = key;
  showTooltip(e, refs);
}

function showTooltip(e, refs) {
  tooltip.innerHTML = '<button type="button" class="tooltip-close" aria-label="关闭">✕</button>' + getTooltipContent(refs);
  tooltip.querySelector('.tooltip-close').addEventListener('click', (ev) => {
    ev.stopPropagation();
    hideTooltip();
  });
  tooltip.style.display = 'block';
  tooltip.classList.toggle('sticky', tooltipPinned);
  moveTooltip(e);
}

function moveTooltip(e) {
  const rect = tooltip.getBoundingClientRect();
  const winW = window.innerWidth;
  const winH = window.innerHeight;
  let finalX = e.clientX + 15;
  let finalY = e.clientY + 15;
  if (finalX + rect.width > winW - 8) finalX = e.clientX - rect.width - 10;
  if (finalY + rect.height > winH - 8) finalY = e.clientY - rect.height - 10;
  // 视口边界约束，保证不超出屏幕边缘
  finalX = Math.max(8, Math.min(finalX, winW - rect.width - 8));
  finalY = Math.max(8, Math.min(finalY, winH - rect.height - 8));
  tooltip.style.left = finalX + 'px';
  tooltip.style.top = finalY + 'px';
}

function hideTooltip() {
  tooltip.style.display = 'none';
  tooltip.classList.remove('sticky');
  tooltipPinned = false;
  tooltipKey = null;
}

async function setLeague(league) {
  closeLeaguePanel();
  markLeagueSeen(league);
  if (league === currentLeague && allData[league]) return;
  const token = ++leagueLoadToken;
  currentLeague = league;
  currentSeason = 'all';
  updateLeagueButton();

  const statusEl = document.getElementById('api-status');
  let merge = null;
  try {
    merge = await ensureLeagueLoaded(league);
  } catch (err) {
    if (token !== leagueLoadToken) return;
    statusEl.textContent = '❌ 联赛数据加载失败（' + err.message + '）。请确认 data/' + league + '.js 存在。';
    statusEl.style.color = '#ff6b6b';
    return;
  }
  if (token !== leagueLoadToken) return;  // 加载期间又切换了其他联赛

  populateSeasonSelect();
  updatePageInfo();

  statusEl.style.color = '#4dd0a8';
  let msg = leagueMetaMap[league].flag + ' ' + allData[league].cn + ' 共 ' + allData[league].matches.length + ' 场';
  if (merge && (merge.added > 0 || merge.updated > 0)) {
    msg += ' · 最新战绩新增 ' + merge.added + '、更新 ' + merge.updated;
  }
  if (latestMeta && latestMeta.updated_at) {
    msg += ' · 更新时间：' + new Date(latestMeta.updated_at).toLocaleString('zh-CN');
  }
  statusEl.textContent = '✅ ' + msg;

  renderAll();
}

// 通过 <script> 标签加载数据文件（兼容 file:// 直接双击打开，浏览器不限制 script src）
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src + '?_=' + Date.now();
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('无法加载 ' + src));
    document.head.appendChild(s);
  });
}

// ===== 联赛更新红点 =====
// localStorage 记录每个联赛「上次看到的最新比赛日期」，football_latest.js 里有更新的日期就打红点
const SEEN_KEY = 'fb_seen_latest_v1';
let updatedLeagues = new Set();

function loadSeenLatest() {
  try { return JSON.parse(localStorage.getItem(SEEN_KEY)) || {}; } catch (e) { return {}; }
}
function saveSeenLatest(s) {
  try { localStorage.setItem(SEEN_KEY, JSON.stringify(s)); } catch (e) {}
}
function leagueLatestDates() {
  const out = {};
  Object.keys(latestByLeague).forEach(code => {
    let max = '';
    latestByLeague[code].forEach(m => { if (m.date && m.date > max) max = m.date; });
    if (max) out[code] = max;
  });
  return out;
}
// 首次访问静默建立基线（不打点）；之后有更新日期的联赛进 updatedLeagues
function computeUpdatedLeagues() {
  const latest = leagueLatestDates();
  updatedLeagues = new Set();
  if (localStorage.getItem(SEEN_KEY) === null) {
    saveSeenLatest(latest);
    return;
  }
  const seen = loadSeenLatest();
  Object.keys(latest).forEach(code => {
    if (!seen[code] || latest[code] > seen[code]) updatedLeagues.add(code);
  });
}
// 点进某联赛即视为已读，红点消失
function markLeagueSeen(code) {
  const latest = leagueLatestDates();
  if (!latest[code]) return;
  const seen = loadSeenLatest();
  if (seen[code] === latest[code]) { updatedLeagues.delete(code); refreshLeagueDots(); return; }
  seen[code] = latest[code];
  saveSeenLatest(seen);
  updatedLeagues.delete(code);
  refreshLeagueDots();
}
function refreshLeagueDots() {
  document.querySelectorAll('.league-item').forEach(el => {
    el.classList.toggle('has-update', updatedLeagues.has(el.dataset.code));
  });
  const btnDot = document.getElementById('league-btn-dot');
  if (btnDot) btnDot.classList.toggle('hidden', updatedLeagues.size === 0);
}

function closeLeaguePanel() {
  document.getElementById('league-overlay').classList.remove('open');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeLeaguePanel();
});

// ===== 数据加载 =====
// 加载 update_scores.py 生成的最新战绩（football_latest.js -> window.LATEST_DATA），按联赛码暂存
async function loadLatestData() {
  try {
    await loadScript('football_latest.js');
    const data = window.LATEST_DATA;
    if (!data || !Array.isArray(data.matches)) {
      throw new Error('数据格式不正确');
    }
    data.matches.forEach(m => {
      if (!m._league) return;
      (latestByLeague[m._league] = latestByLeague[m._league] || []).push(m);
    });
    latestMeta = { count: data.matches.length, updated_at: data.updated_at || null };
  } catch (err) {
    latestMeta = null;
    console.log('加载最新数据失败:', err.message);
  }
}

// 把暂存的增量数据合并进指定联赛（日期+主队+客队为唯一键去重），返回 {added, updated}
function mergeLatestInto(league) {
  const list = latestByLeague[league];
  if (!list || !allData[league]) return { added: 0, updated: 0 };
  const matches = allData[league].matches;
  const idx = new Map();
  matches.forEach((m, i) => idx.set(m.date + '|' + m.team1 + '|' + m.team2, i));

  let added = 0, updated = 0;
  list.forEach(m => {
    const key = m.date + '|' + m.team1 + '|' + m.team2;
    if (idx.has(key)) {
      matches[idx.get(key)] = { ...matches[idx.get(key)], ...m };
      updated++;
    } else {
      matches.push(m);
      added++;
    }
  });
  matches.sort((a, b) => new Date(a.date) - new Date(b.date));
  return { added, updated };
}

// 懒加载单个联赛数据文件（data/{code}.js -> window.LEAGUE_DATA），内存缓存
async function ensureLeagueLoaded(code) {
  if (allData[code]) return { added: 0, updated: 0 };
  const statusEl = document.getElementById('api-status');
  const meta = leagueMetaMap[code];
  statusEl.style.color = '#4dd0a8';
  statusEl.textContent = '⏳ 正在加载 ' + (meta ? meta.cn : code) + ' 历史数据...';
  await loadScript('data/' + code + '.js');
  const d = window.LEAGUE_DATA;
  if (!d || d.code !== code || !Array.isArray(d.matches)) {
    throw new Error('data/' + code + '.js 数据格式不正确');
  }
  allData[code] = d;
  return mergeLatestInto(code);
}

async function initApp() {
  const statusEl = document.getElementById('api-status');
  try {
    await loadScript('leagues.js');
    if (!Array.isArray(window.LEAGUES_MANIFEST) || window.LEAGUES_MANIFEST.length === 0) {
      throw new Error('leagues.js 中未找到 LEAGUES_MANIFEST');
    }
    buildLeaguePanel();
  } catch (err) {
    statusEl.textContent = '❌ 无法加载 leagues.js 联赛目录（' + err.message + '）。请先运行 fetch_history.py 生成数据文件。';
    statusEl.style.color = '#ff6b6b';
    console.error('加载联赛目录失败:', err);
    return;
  }
  updateLeagueButton();
  statusEl.textContent = '正在检查最新战绩数据...';
  await loadLatestData();
  computeUpdatedLeagues();
  refreshLeagueDots();
  await setLeague(currentLeague);
}

// ===== 球迷聊天室 =====
const chatState = { me: null, lastId: 0, timer: null, pollBusy: false, seen: new Set() };
const chatMsgsEl = document.getElementById('chat-msgs');
const chatInputEl = document.getElementById('chat-input');
const chatSendEl = document.getElementById('chat-send');

function chatScrollBottom() { chatMsgsEl.scrollTop = chatMsgsEl.scrollHeight; }

function renderChatMsg(m) {
  if (chatState.seen.has(m.id)) return;  // 已渲染过的消息不再重复渲染
  chatState.seen.add(m.id);
  // 抖音评论区风格：一律靠左、无头像、「昵称：内容」同一行
  const item = document.createElement('div');
  item.className = 'chat-item';
  const line = document.createElement('div');
  line.className = 'chat-line';
  const nick = document.createElement('span');
  nick.className = 'nick';
  nick.textContent = m.nickname || '用户';
  line.appendChild(nick);
  line.appendChild(document.createTextNode('：'));
  if (m.kind === 'image') {
    line.appendChild(document.createTextNode('[图片]'));
    const img = document.createElement('img');
    img.className = 'chat-thumb';
    img.src = m.text;  // 后端只返回 /api/chat/img/ 路径
    img.alt = '聊天图片';
    img.loading = 'lazy';
    img.addEventListener('click', () => openLightbox(m.text));
    item.appendChild(line);
    item.appendChild(img);
  } else {
    const textNode = document.createElement('span');
    textNode.textContent = m.text;  // 纯文本插入，防 XSS
    line.appendChild(textNode);
    const d = new Date(m.created_at * 1000);
    const time = document.createElement('span');
    time.className = 'ctime';
    time.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    line.appendChild(time);
    item.appendChild(line);
  }
  chatMsgsEl.appendChild(item);
}

function openLightbox(src) {
  const lb = document.getElementById('chat-lightbox');
  document.getElementById('chat-lightbox-img').src = src;
  lb.classList.remove('hidden');
}
document.getElementById('chat-lightbox').addEventListener('click', function () {
  this.classList.add('hidden');
});

async function chatPoll(initial) {
  if (chatState.pollBusy) return;  // 上一次拉取未完成就跳过，防止并发重复渲染
  chatState.pollBusy = true;
  try {
    const url = '/api/chat/messages' + (chatState.lastId ? '?after_id=' + chatState.lastId : '');
    const r = await fetch(url, { credentials: 'same-origin' });
    const d = r.ok ? await r.json() : null;
    if (d && d.ok && d.messages.length) {
      if (initial) { chatMsgsEl.innerHTML = ''; chatState.seen.clear(); }
      d.messages.forEach(renderChatMsg);
      chatState.lastId = Math.max(chatState.lastId, d.messages[d.messages.length - 1].id);
      chatScrollBottom();
    } else if (initial) {
      chatMsgsEl.innerHTML = '<div class="chat-empty">还没有消息，来说第一句吧</div>';
    }
  } catch (e) {} finally { chatState.pollBusy = false; }
}

function chatApplyLoginState() {
  if (chatState.me) {
    chatInputEl.readOnly = false;
    chatInputEl.placeholder = '说点什么…（200 字以内）';
  } else {
    chatInputEl.readOnly = true;
    chatInputEl.placeholder = '登录后参与聊天';
  }
}

async function chatSend() {
  if (!chatState.me) { location.href = '/login.html'; return; }
  const text = chatInputEl.value.trim();
  if (!text) return;
  chatSendEl.disabled = true;
  try {
    const r = await fetch('/api/chat/send', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const d = await r.json().catch(() => ({}));
    if (d && d.ok) {
      chatInputEl.value = '';
      renderChatMsg(d.message);
      chatState.lastId = Math.max(chatState.lastId, d.message.id);
      chatScrollBottom();
    } else if (d && d.need_login) {
      location.href = '/login.html';
      return;
    } else {
      chatInputEl.placeholder = (d && d.error) || '发送失败';
      setTimeout(() => { chatInputEl.placeholder = '说点什么…（200 字以内）'; }, 2000);
    }
  } catch (e) {} finally { chatSendEl.disabled = false; }
}

(async function initChat() {
  try {
    const r = await fetch('/api/auth/me', { credentials: 'same-origin' });
    const d = r.ok ? await r.json() : null;
    if (d && d.ok && d.email) chatState.me = d;
  } catch (e) {}
  chatApplyLoginState();
  await chatPoll(true);  // 首次拉取完成后再启动定时轮询，避免并发拉两遍
  chatState.timer = setInterval(() => chatPoll(false), 3000);
})();
chatSendEl.addEventListener('click', chatSend);
chatInputEl.addEventListener('click', () => { if (!chatState.me) location.href = '/login.html'; });
chatInputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') chatSend(); });

// ===== 聊天发图片 =====
const chatImgBtn = document.getElementById('chat-img-btn');
const chatImgFile = document.getElementById('chat-img-file');
chatImgBtn.addEventListener('click', () => {
  if (!chatState.me) { location.href = '/login.html'; return; }
  chatImgFile.click();
});
chatImgFile.addEventListener('change', function () {
  const file = this.files && this.files[0];
  this.value = '';
  if (!file) return;
  if (!/^image\/(jpeg|png|webp|gif)$/.test(file.type)) {
    chatInputEl.placeholder = '仅支持 jpg/png/webp/gif 图片';
    setTimeout(() => { chatInputEl.placeholder = '说点什么…（200 字以内）'; }, 2000);
    return;
  }
  if (file.size > 5 * 1024 * 1024) {
    chatInputEl.placeholder = '图片过大（超过 5MB）';
    setTimeout(() => { chatInputEl.placeholder = '说点什么…（200 字以内）'; }, 2000);
    return;
  }
  const reader = new FileReader();
  reader.onload = async () => {
    chatImgBtn.disabled = true;
    try {
      const r = await fetch('/api/chat/upload', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: reader.result })
      });
      const d = await r.json().catch(() => ({}));
      if (d && d.ok) {
        renderChatMsg(d.message);
        chatState.lastId = Math.max(chatState.lastId, d.message.id);
        chatScrollBottom();
      } else if (d && d.need_login) {
        location.href = '/login.html';
      } else {
        chatInputEl.placeholder = (d && d.error) || '图片发送失败';
        setTimeout(() => { chatInputEl.placeholder = '说点什么…（200 字以内）'; }, 2000);
      }
    } catch (e) {} finally { chatImgBtn.disabled = false; }
  };
  reader.readAsDataURL(file);
});

// ===== 悬浮客服求助（双向聊天） =====
const supportState = { lastId: 0, open: false, started: false };
const spMsgsEl = document.getElementById('support-msgs');

function renderSupportMsg(m) {
  const mine = m.sender === 'user';
  const item = document.createElement('div');
  item.className = 'sp-item' + (mine ? ' mine' : '');
  const wrap = document.createElement('div');
  if (!mine) {
    const meta = document.createElement('div');
    meta.className = 'sp-meta';
    meta.textContent = m.sender_name || '客服';
    wrap.appendChild(meta);
  }
  const bubble = document.createElement('div');
  bubble.className = 'sp-bubble';
  if (m.kind === 'image') {
    const img = document.createElement('img');
    img.src = m.text;
    img.loading = 'lazy';
    img.alt = '图片';
    img.addEventListener('click', () => openLightbox(m.text));
    bubble.appendChild(img);
  } else {
    bubble.textContent = m.text;
  }
  wrap.appendChild(bubble);
  item.appendChild(wrap);
  spMsgsEl.appendChild(item);
}

async function supportPoll(initial) {
  try {
    const url = '/api/support/my' + (supportState.lastId ? '?after_id=' + supportState.lastId : '');
    const r = await fetch(url, { credentials: 'same-origin' });
    const d = r.ok ? await r.json() : null;
    if (d && d.ok) {
      if (d.messages.length) {
        if (initial) spMsgsEl.innerHTML = '';
        d.messages.forEach(renderSupportMsg);
        supportState.lastId = d.messages[d.messages.length - 1].id;
        spMsgsEl.scrollTop = spMsgsEl.scrollHeight;
      } else if (initial) {
        spMsgsEl.innerHTML = '<div class="support-empty">你好，有什么问题可以留言，<br>客服会尽快回复（游客也可使用）</div>';
      }
    }
  } catch (e) {}
}

function toggleSupport(show) {
  const modal = document.getElementById('support-modal');
  const open = typeof show === 'boolean' ? show : modal.classList.contains('hidden');
  modal.classList.toggle('hidden', !open);
  supportState.open = open;
  if (open && !supportState.started) {
    supportState.started = true;
    supportPoll(true);
    setInterval(() => { if (supportState.open) supportPoll(false); }, 3000);
    document.getElementById('support-text').focus();
  }
}

async function submitSupport() {
  const input = document.getElementById('support-text');
  const text = input.value.trim();
  if (!text) return;
  const btn = document.getElementById('support-submit');
  btn.disabled = true;
  try {
    const r = await fetch('/api/support/send', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const d = await r.json().catch(() => ({}));
    if (d && d.ok) {
      input.value = '';
      if (spMsgsEl.querySelector('.support-empty')) spMsgsEl.innerHTML = '';
      renderSupportMsg(d.message);
      supportState.lastId = Math.max(supportState.lastId, d.message.id);
      spMsgsEl.scrollTop = spMsgsEl.scrollHeight;
    } else {
      input.placeholder = (d && d.error) || '发送失败';
      setTimeout(() => { input.placeholder = '描述你的问题…'; }, 2000);
    }
  } catch (e) {} finally { btn.disabled = false; }
}
document.getElementById('support-text').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') submitSupport();
});

// 客服发图（游客/用户均可，≤30MB，复用聊天室的 base64 模式）
const supportImgBtn = document.getElementById('support-img-btn');
const supportImgFile = document.getElementById('support-img-file');
supportImgBtn.addEventListener('click', () => supportImgFile.click());
supportImgFile.addEventListener('change', function () {
  const file = this.files && this.files[0];
  this.value = '';
  if (!file) return;
  if (file.size > 30 * 1024 * 1024) {
    const input = document.getElementById('support-text');
    input.placeholder = '图片过大（超过 30MB）';
    setTimeout(() => { input.placeholder = '描述你的问题…'; }, 2000);
    return;
  }
  const reader = new FileReader();
  reader.onload = async () => {
    supportImgBtn.disabled = true;
    try {
      const r = await fetch('/api/support/upload', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: reader.result })
      });
      const d = await r.json().catch(() => ({}));
      if (d && d.ok) {
        if (spMsgsEl.querySelector('.support-empty')) spMsgsEl.innerHTML = '';
        renderSupportMsg(d.message);
        supportState.lastId = Math.max(supportState.lastId, d.message.id);
        spMsgsEl.scrollTop = spMsgsEl.scrollHeight;
      } else {
        const input = document.getElementById('support-text');
        input.placeholder = (d && d.error) || '图片发送失败';
        setTimeout(() => { input.placeholder = '描述你的问题…'; }, 2000);
      }
    } catch (e) {} finally { supportImgBtn.disabled = false; }
  };
  reader.readAsDataURL(file);
});

// ===== 顶部公告横幅 =====
(async function initAnnouncement() {
  try {
    const r = await fetch('/api/announcement', { credentials: 'same-origin' });
    const d = r.ok ? await r.json() : null;
    if (!d || !d.ok || !d.announcement) return;
    const ann = d.announcement;
    if (localStorage.getItem('ann_dismissed') === String(ann.id)) return;
    const banner = document.getElementById('ann-banner');
    document.getElementById('ann-banner-text').textContent = '📢 ' + ann.text;
    banner.classList.remove('hidden');
    document.body.style.paddingTop = banner.offsetHeight + 'px';
    document.getElementById('ann-banner-close').addEventListener('click', () => {
      banner.classList.add('hidden');
      document.body.style.paddingTop = '';
      localStorage.setItem('ann_dismissed', String(ann.id));
    });
  } catch (e) {}
})();

// 账户角标：显示当前登录邮箱，退出登录
(async function initAccountChip() {
  const chip = document.getElementById('account-chip');
  try {
    const r = await fetch('/api/auth/me', { credentials: 'same-origin' });
    const d = r.ok ? await r.json() : null;
    if (d && d.ok && d.email) {
      const nick = d.nickname || d.email.split('@')[0];
      document.getElementById('account-email').textContent = nick;
      if (d.avatar) {
        const img = document.getElementById('account-avatar-img');
        img.src = d.avatar;
        img.style.display = '';
        document.getElementById('account-avatar-letter').style.display = 'none';
      } else {
        document.getElementById('account-avatar-letter').textContent = nick.charAt(0).toUpperCase();
      }
      return;  // 登录态：头像+昵称+退出
    }
  } catch (e) {}
  // 游客态：显示「登录」「注册」两个按钮
  chip.classList.add('guest');
  const loginLink = document.createElement('a');
  loginLink.id = 'login-link';
  loginLink.href = '/login.html';
  loginLink.textContent = '登录';
  chip.appendChild(loginLink);
  const regLink = document.createElement('a');
  regLink.id = 'register-link';
  regLink.href = '/login.html#register';
  regLink.textContent = '注册';
  chip.appendChild(regLink);
})();
async function doLogout() {
  try { await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
  location.href = '/login.html';
}
